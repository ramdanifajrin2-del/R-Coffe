<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b271d"/>
      <stop offset="100%" stop-color="#140c08"/>
    </radialGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="layers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8ef"/>
      <stop offset="35%" stop-color="#cb9b6d"/>
      <stop offset="65%" stop-color="#5a2f14"/>
      <stop offset="85%" stop-color="#f2deca"/>
      <stop offset="100%" stop-color="#e29b46"/>
    </linearGradient>
    <linearGradient id="caramelDrizzle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4791a"/>
      <stop offset="50%" stop-color="#fca834"/>
      <stop offset="100%" stop-color="#b85f09"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bg)"/>
  <!-- Coaster -->
  <ellipse cx="300" cy="385" rx="110" ry="22" fill="#090503" opacity="0.6"/>
  <ellipse cx="300" cy="380" rx="100" ry="18" fill="#a8754f"/>

  <!-- Tall Glass Body -->
  <path d="M 240,160 L 255,360 C 257,372 343,372 345,360 L 360,160 Z" fill="url(#layers)"/>
  <!-- Glass highlights -->
  <path d="M 238,155 L 253,362 C 255,376 345,376 347,362 L 362,155 Z" fill="url(#glass)" stroke="#fff" stroke-width="2" stroke-opacity="0.4"/>
  <ellipse cx="300" cy="155" rx="62" ry="16" fill="none" stroke="#fff" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Whipped Cream on Top -->
  <path d="M 245,155 Q 260,120 280,135 Q 300,105 320,130 Q 345,115 355,155 Z" fill="#fffcf7"/>
  <path d="M 280,135 Q 300,90 310,130 Z" fill="#ffffff"/>

  <!-- Caramel Sauce Drizzle -->
  <path d="M 260,140 Q 285,130 310,145 T 345,135" fill="none" stroke="url(#caramelDrizzle)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 255,150 Q 280,145 320,152 T 345,148" fill="none" stroke="url(#caramelDrizzle)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 275,135 L 273,200" fill="none" stroke="url(#caramelDrizzle)" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <path d="M 325,145 L 328,190" fill="none" stroke="url(#caramelDrizzle)" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Straw -->
  <line x1="335" y1="90" x2="310" y2="350" stroke="#d9c4a5" stroke-width="7" stroke-linecap="round"/>
  <line x1="335" y1="90" x2="310" y2="350" stroke="#a8754f" stroke-width="2" stroke-dasharray="8,8" stroke-linecap="round"/>

  <!-- Badge / Label -->
  <rect x="225" y="402" width="150" height="28" rx="14" fill="#a8754f" opacity="0.9"/>
  <text x="300" y="421" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle" letter-spacing="1">CARAMEL LATTE</text>
</svg>
