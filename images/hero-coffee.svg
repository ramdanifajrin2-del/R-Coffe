<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d271d" />
      <stop offset="50%" stop-color="#24150f" />
      <stop offset="100%" stop-color="#140b07" />
    </linearGradient>
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#805333" />
      <stop offset="30%" stop-color="#5a3821" />
      <stop offset="100%" stop-color="#382113" />
    </linearGradient>
    <radialGradient id="lightGlow" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f5deb3" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#f5deb3" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8dec8" />
      <stop offset="25%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#dfd2b5" />
      <stop offset="100%" stop-color="#b8a789" />
    </linearGradient>
    <radialGradient id="coffeeGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#e2c59f" />
      <stop offset="30%" stop-color="#c99765" />
      <stop offset="70%" stop-color="#6e3e1e" />
      <stop offset="100%" stop-color="#3b1d0c" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Cafe Mood -->
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <circle cx="360" cy="220" r="320" fill="url(#lightGlow)" />

  <!-- Wooden Table -->
  <path d="M0,380 Q400,360 800,380 L800,600 L0,600 Z" fill="url(#tableGrad)" />
  <line x1="0" y1="410" x2="800" y2="410" stroke="#462a17" stroke-width="2" opacity="0.6" />
  <line x1="0" y1="470" x2="800" y2="470" stroke="#462a17" stroke-width="2" opacity="0.4" />

  <!-- Saucer Shadow -->
  <ellipse cx="400" cy="460" rx="210" ry="50" fill="#0c0704" opacity="0.7" />

  <!-- Saucer Plate -->
  <ellipse cx="400" cy="450" rx="200" ry="45" fill="url(#cupGrad)" filter="url(#shadow)" />
  <ellipse cx="400" cy="448" rx="150" ry="32" fill="#d4c5a6" />
  <ellipse cx="400" cy="446" rx="140" ry="28" fill="#efe6d3" />

  <!-- Cup Shadow -->
  <ellipse cx="400" cy="425" rx="125" ry="30" fill="#201109" opacity="0.5" />

  <!-- Cup Handle -->
  <path d="M 500,300 C 580,300 575,390 495,385 C 475,384 475,365 495,365 C 545,365 545,320 495,320 Z" fill="url(#cupGrad)" filter="url(#shadow)" />

  <!-- Cup Body -->
  <path d="M 285,270 C 290,390 330,430 400,430 C 470,430 510,390 515,270 Z" fill="url(#cupGrad)" filter="url(#shadow)" />
  
  <!-- Cup Rim (Top Opening) -->
  <ellipse cx="400" cy="270" rx="115" ry="40" fill="#fdfbf7" stroke="#d5c7aa" stroke-width="3" />
  
  <!-- Coffee Liquid Surface -->
  <ellipse cx="400" cy="272" rx="104" ry="34" fill="url(#coffeeGrad)" />

  <!-- Latte Art - Rosette / Heart Pattern -->
  <!-- Base Cream Ring -->
  <path d="M350,265 C370,250 430,250 450,265 C440,285 360,285 350,265 Z" fill="#fff5ea" opacity="0.85" />
  <!-- Heart Wings -->
  <path d="M400,278 C365,250 375,235 400,252 C425,235 435,250 400,278 Z" fill="#ffffff" />
  <!-- Secondary Leaf -->
  <path d="M400,268 C375,248 385,238 400,252 C415,238 425,248 400,268 Z" fill="#fff9f0" />
  <!-- Top Heart -->
  <path d="M400,254 C385,240 390,234 400,244 C410,234 415,240 400,254 Z" fill="#ffffff" />
  <!-- Stem Center Line -->
  <line x1="400" y1="240" x2="400" y2="284" stroke="#c48a52" stroke-width="2.5" stroke-linecap="round" />

  <!-- Rising Steam Curls -->
  <path d="M370,220 Q355,180 380,140 T365,80" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.35" />
  <path d="M410,215 Q430,170 405,130 T420,70" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.45" />
  <path d="M445,225 Q460,185 440,150 T450,95" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.3" />

  <!-- Roasted Coffee Beans on Table -->
  <g transform="translate(180, 470) rotate(-25)">
    <ellipse cx="0" cy="0" rx="16" ry="11" fill="#2b1408" />
    <path d="M-13,0 Q0,4 13,0" stroke="#784421" stroke-width="2.5" fill="none" />
  </g>
  <g transform="translate(210, 485) rotate(40)">
    <ellipse cx="0" cy="0" rx="15" ry="10" fill="#381b0b" />
    <path d="M-12,0 Q0,-3 12,0" stroke="#8c522b" stroke-width="2" fill="none" />
  </g>
  <g transform="translate(165, 500) rotate(10)">
    <ellipse cx="0" cy="0" rx="14" ry="9" fill="#261005" />
    <path d="M-11,0 Q0,3 11,0" stroke="#6b3a1a" stroke-width="2" fill="none" />
  </g>
  <g transform="translate(620, 470) rotate(35)">
    <ellipse cx="0" cy="0" rx="16" ry="11" fill="#32170a" />
    <path d="M-13,0 Q0,-4 13,0" stroke="#7e4622" stroke-width="2.5" fill="none" />
  </g>
  <g transform="translate(650, 495) rotate(-15)">
    <ellipse cx="0" cy="0" rx="14" ry="10" fill="#220d04" />
    <path d="M-11,0 Q0,3 11,0" stroke="#5a2e14" stroke-width="2" fill="none" />
  </g>

  <!-- Elegant Badge / Title text inside image -->
  <text x="400" y="560" font-family="'Playfair Display', serif" font-size="22" font-weight="bold" fill="#f4ebdd" text-anchor="middle" letter-spacing="3" opacity="0.9">R COFFE SIGNATURE</text>
</svg>
