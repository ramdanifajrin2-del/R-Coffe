<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#212e22"/>
      <stop offset="100%" stop-color="#0c140d"/>
    </radialGradient>
    <linearGradient id="matchaCeramic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a382c"/>
      <stop offset="35%" stop-color="#415444"/>
      <stop offset="70%" stop-color="#2a382c"/>
      <stop offset="100%" stop-color="#19241b"/>
    </linearGradient>
    <radialGradient id="matchaGreen" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#9dc183"/>
      <stop offset="50%" stop-color="#608a4f"/>
      <stop offset="100%" stop-color="#3b5e2f"/>
    </radialGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bg)"/>
  <!-- Bamboo mat surface -->
  <ellipse cx="300" cy="355" rx="160" ry="32" fill="#060b07" opacity="0.6"/>
  <ellipse cx="300" cy="345" rx="150" ry="28" fill="#586e57"/>
  <ellipse cx="300" cy="342" rx="135" ry="24" fill="#324534"/>

  <!-- Handle -->
  <path d="M 370,220 C 440,220 435,300 370,295 C 350,295 350,278 370,278 C 405,278 405,238 370,238 Z" fill="#2a382c"/>

  <!-- Cup -->
  <path d="M 210,200 C 215,310 245,335 300,335 C 355,335 385,310 390,200 Z" fill="url(#matchaCeramic)"/>
  <ellipse cx="300" cy="200" rx="90" ry="30" fill="#415444" stroke="#5b755f" stroke-width="2"/>

  <!-- Matcha Foam Surface -->
  <ellipse cx="300" cy="200" rx="82" ry="25" fill="url(#matchaGreen)"/>

  <!-- Delicate Leaf Latte Art in Cream -->
  <path d="M 300,212 C 275,190 280,175 300,185 C 320,175 325,190 300,212 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M 300,195 C 285,180 290,170 300,178 C 310,170 315,180 300,195 Z" fill="#ffffff"/>
  <circle cx="300" cy="172" r="5" fill="#ffffff"/>
  <line x1="300" y1="168" x2="300" y2="214" stroke="#507342" stroke-width="2"/>

  <!-- Matcha Bamboo Whisk Silhouette in background -->
  <g transform="translate(140, 260) rotate(-35)" opacity="0.4">
    <rect x="0" y="0" width="14" height="60" rx="4" fill="#d9c4a5"/>
    <path d="M -10,60 L 24,60 L 18,95 L -4,95 Z" fill="#c4aa82"/>
  </g>

  <!-- Steam -->
  <path d="M290,160 Q275,115 290,75" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
  <path d="M315,155 Q325,110 310,70" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Badge / Label -->
  <rect x="235" y="395" width="130" height="28" rx="14" fill="#4f7942" opacity="0.9"/>
  <text x="300" y="414" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle" letter-spacing="1">MATCHA LATTE</text>
</svg>
