<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2c1e18"/>
      <stop offset="100%" stop-color="#140c08"/>
    </radialGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="coffee" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#542e13"/>
      <stop offset="20%" stop-color="#2a1408"/>
      <stop offset="100%" stop-color="#150803"/>
    </linearGradient>
    <radialGradient id="crema" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#c89255"/>
      <stop offset="60%" stop-color="#935728"/>
      <stop offset="100%" stop-color="#4e260c"/>
    </radialGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bg)"/>
  <!-- Table surface -->
  <ellipse cx="300" cy="380" rx="220" ry="40" fill="#080402" opacity="0.6"/>

  <!-- Glass Cup -->
  <!-- Back Coffee Body -->
  <path d="M 220,170 L 235,340 C 238,360 362,360 365,340 L 380,170 Z" fill="url(#coffee)"/>

  <!-- Glass Sheen & Thickness -->
  <path d="M 215,160 L 232,342 C 236,368 364,368 368,342 L 385,160 Z" fill="url(#glass)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4"/>
  <ellipse cx="300" cy="160" rx="85" ry="25" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.5"/>

  <!-- Crema Surface Layer -->
  <ellipse cx="300" cy="172" rx="78" ry="22" fill="url(#crema)"/>
  <!-- Crema swirl bubbles -->
  <circle cx="285" cy="170" r="14" fill="#d9a86c" opacity="0.4"/>
  <circle cx="315" cy="174" r="18" fill="#deb178" opacity="0.3"/>
  <circle cx="298" cy="176" r="10" fill="#eed2a6" opacity="0.5"/>

  <!-- Specular highlights on glass -->
  <path d="M 230,190 L 242,325" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.4"/>
  <path d="M 240,195 L 248,270" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.3"/>

  <!-- Hot Steam -->
  <path d="M280,135 Q265,100 285,65 T275,30" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
  <path d="M315,130 Q335,95 315,60 T325,25" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.35"/>

  <!-- Badge / Label -->
  <rect x="230" y="395" width="140" height="28" rx="14" fill="#a8754f" opacity="0.9"/>
  <text x="300" y="414" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle" letter-spacing="1">HOT AMERICANO</text>
</svg>
