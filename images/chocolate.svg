<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#302018"/>
      <stop offset="100%" stop-color="#120a06"/>
    </radialGradient>
    <linearGradient id="mug" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c94b32"/>
      <stop offset="35%" stop-color="#e05d43"/>
      <stop offset="70%" stop-color="#c94b32"/>
      <stop offset="100%" stop-color="#8a2e1c"/>
    </linearGradient>
    <radialGradient id="choco" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#5a2e18"/>
      <stop offset="70%" stop-color="#3b1b0c"/>
      <stop offset="100%" stop-color="#241006"/>
    </radialGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bg)"/>
  <!-- Coaster -->
  <ellipse cx="300" cy="365" rx="150" ry="26" fill="#090503" opacity="0.6"/>
  <ellipse cx="300" cy="358" rx="140" ry="22" fill="#5c3822"/>

  <!-- Handle -->
  <path d="M 370,225 C 440,225 435,310 370,305 C 350,305 350,285 370,285 C 405,285 405,245 370,245 Z" fill="#b03e27"/>

  <!-- Mug Body -->
  <path d="M 220,195 L 230,340 C 232,352 368,352 370,340 L 380,195 Z" fill="url(#mug)"/>
  <ellipse cx="300" cy="195" rx="80" ry="24" fill="#e05d43" stroke="#f07e67" stroke-width="2"/>

  <!-- Rich Hot Chocolate Liquid -->
  <ellipse cx="300" cy="197" rx="74" ry="20" fill="url(#choco)"/>

  <!-- Mini Marshmallows Floating -->
  <g fill="#ffffff" stroke="#e8ded8" stroke-width="1">
    <ellipse cx="270" cy="195" rx="14" ry="10" transform="rotate(-10, 270, 195)"/>
    <ellipse cx="320" cy="192" rx="12" ry="9" transform="rotate(20, 320, 192)"/>
    <ellipse cx="295" cy="188" rx="15" ry="11" transform="rotate(5, 295, 188)"/>
    <ellipse cx="305" cy="202" rx="11" ry="8" transform="rotate(-15, 305, 202)"/>
  </g>

  <!-- Chocolate Sauce Drizzle over Marshmallows -->
  <path d="M 260,192 Q 285,185 310,198 T 335,190" fill="none" stroke="#241006" stroke-width="3" stroke-linecap="round"/>

  <!-- Steam -->
  <path d="M285,155 Q270,110 290,70" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <path d="M315,150 Q330,105 315,65" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.35"/>

  <!-- Badge / Label -->
  <rect x="225" y="395" width="150" height="28" rx="14" fill="#a8754f" opacity="0.9"/>
  <text x="300" y="414" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle" letter-spacing="1">CHOCOLATE MILK</text>
</svg>
