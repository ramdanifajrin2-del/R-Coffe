<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2c2a1c"/>
      <stop offset="100%" stop-color="#121109"/>
    </radialGradient>
    <linearGradient id="teaLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8a838"/>
      <stop offset="50%" stop-color="#c97e1e"/>
      <stop offset="100%" stop-color="#7a4607"/>
    </linearGradient>
    <linearGradient id="glassCup" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bg)"/>
  <!-- Glass Saucer -->
  <ellipse cx="300" cy="355" rx="160" ry="30" fill="#090804" opacity="0.6"/>
  <ellipse cx="300" cy="345" rx="150" ry="26" fill="none" stroke="#fff" stroke-width="2.5" stroke-opacity="0.5"/>
  <ellipse cx="300" cy="343" rx="135" ry="22" fill="#fff" opacity="0.1"/>

  <!-- Glass Handle -->
  <path d="M 370,215 C 440,215 435,295 370,290 C 352,290 352,274 370,274 C 405,274 405,236 370,236 Z" fill="none" stroke="#fff" stroke-width="6" stroke-opacity="0.5"/>

  <!-- Amber Tea Liquid Inside Glass Cup -->
  <path d="M 215,200 C 220,305 248,330 300,330 C 352,330 380,305 385,200 Z" fill="url(#teaLiquid)"/>

  <!-- Glass Cup Outline & Highlights -->
  <path d="M 210,195 C 215,310 245,335 300,335 C 355,335 385,310 390,195 Z" fill="url(#glassCup)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/>
  <ellipse cx="300" cy="195" rx="90" ry="28" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Tea Surface -->
  <ellipse cx="300" cy="202" rx="82" ry="24" fill="#fca834" opacity="0.8"/>

  <!-- Floating Lemon Slice -->
  <ellipse cx="275" cy="202" rx="28" ry="14" fill="#ffd54f" stroke="#ffb300" stroke-width="2" transform="rotate(-15, 275, 202)"/>
  <circle cx="275" cy="202" r="5" fill="#fff9c4"/>

  <!-- Fresh Green Mint Leaves -->
  <path d="M 320,195 C 310,180 325,170 340,185 C 335,195 325,200 320,195 Z" fill="#4caf50" stroke="#2e7d32" stroke-width="1"/>
  <path d="M 330,202 C 325,190 340,185 350,198 C 342,205 334,208 330,202 Z" fill="#66bb6a"/>

  <!-- Hot Steam -->
  <path d="M285,160 Q270,115 285,75" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
  <path d="M315,155 Q330,110 315,70" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Badge / Label -->
  <rect x="235" y="395" width="130" height="28" rx="14" fill="#7a4607" opacity="0.9"/>
  <text x="300" y="414" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle" letter-spacing="1">HERBAL TEA</text>
</svg>
