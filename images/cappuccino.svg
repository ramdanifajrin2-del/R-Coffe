<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b2b22"/>
      <stop offset="100%" stop-color="#140a05"/>
    </radialGradient>
    <linearGradient id="cupCeramic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3c2415"/>
      <stop offset="30%" stop-color="#54331d"/>
      <stop offset="70%" stop-color="#3c2415"/>
      <stop offset="100%" stop-color="#24150c"/>
    </linearGradient>
    <radialGradient id="foam" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#faf4ea"/>
      <stop offset="100%" stop-color="#e8d5be"/>
    </radialGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bg)"/>
  <!-- Saucer -->
  <ellipse cx="300" cy="355" rx="160" ry="32" fill="#090503" opacity="0.6"/>
  <ellipse cx="300" cy="345" rx="150" ry="28" fill="#3c2415"/>
  <ellipse cx="300" cy="342" rx="135" ry="24" fill="#54331d"/>

  <!-- Handle -->
  <path d="M 370,220 C 440,220 435,300 370,295 C 350,295 350,278 370,278 C 405,278 405,238 370,238 Z" fill="#3c2415"/>

  <!-- Cup -->
  <path d="M 210,200 C 215,310 245,335 300,335 C 355,335 385,310 390,200 Z" fill="url(#cupCeramic)"/>
  <ellipse cx="300" cy="200" rx="90" ry="30" fill="#54331d" stroke="#6e4226" stroke-width="2"/>

  <!-- Thick Fluffy Foam Dome -->
  <ellipse cx="300" cy="198" rx="84" ry="26" fill="url(#foam)"/>
  <!-- Cocoa Powder Dusting -->
  <g fill="#4a220b" opacity="0.75">
    <circle cx="280" cy="195" r="2.5"/>
    <circle cx="290" cy="190" r="3"/>
    <circle cx="310" cy="192" r="2"/>
    <circle cx="320" cy="198" r="3.5"/>
    <circle cx="300" cy="202" r="2"/>
    <circle cx="270" cy="200" r="1.5"/>
    <circle cx="330" cy="194" r="2"/>
    <circle cx="285" cy="204" r="2.5"/>
    <circle cx="315" cy="205" r="2"/>
    <circle cx="302" cy="192" r="4"/>
  </g>
  <!-- Cinnamon Stick on Saucer -->
  <g transform="translate(370, 340) rotate(-15)">
    <rect x="0" y="0" width="70" height="12" rx="6" fill="#804a25" stroke="#522b11" stroke-width="1.5"/>
    <line x1="5" y1="6" x2="65" y2="6" stroke="#46240d" stroke-width="1.5"/>
  </g>

  <!-- Steam -->
  <path d="M290,160 Q275,115 295,75" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <path d="M315,155 Q330,110 315,70" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.35"/>

  <!-- Badge / Label -->
  <rect x="235" y="395" width="130" height="28" rx="14" fill="#a8754f" opacity="0.9"/>
  <text x="300" y="414" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle" letter-spacing="1">CAPPUCCINO</text>
</svg>
