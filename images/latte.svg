<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#33241b"/>
      <stop offset="100%" stop-color="#140a05"/>
    </radialGradient>
    <linearGradient id="cup" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="40%" stop-color="#f4ebdd"/>
      <stop offset="100%" stop-color="#d9c4a5"/>
    </linearGradient>
    <radialGradient id="coffeeSurface" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8cca7"/>
      <stop offset="60%" stop-color="#b07a48"/>
      <stop offset="100%" stop-color="#5a3111"/>
    </radialGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bg)"/>
  <!-- Saucer & Shadow -->
  <ellipse cx="300" cy="355" rx="160" ry="32" fill="#090503" opacity="0.6"/>
  <ellipse cx="300" cy="345" rx="150" ry="28" fill="#d9c4a5"/>
  <ellipse cx="300" cy="342" rx="135" ry="24" fill="#fdfbf7"/>

  <!-- Handle -->
  <path d="M 370,220 C 440,220 435,300 370,295 C 350,295 350,278 370,278 C 405,278 405,238 370,238 Z" fill="#e8dac6"/>

  <!-- Cup -->
  <path d="M 210,200 C 215,310 245,335 300,335 C 355,335 385,310 390,200 Z" fill="url(#cup)"/>
  <ellipse cx="300" cy="200" rx="90" ry="30" fill="#fdfbf7" stroke="#e0d0b8" stroke-width="2"/>

  <!-- Latte Surface -->
  <ellipse cx="300" cy="202" rx="82" ry="25" fill="url(#coffeeSurface)"/>

  <!-- Tulip Latte Art -->
  <!-- Bottom tier -->
  <path d="M 275,200 C 285,185 315,185 325,200 C 315,212 285,212 275,200 Z" fill="#ffffff" opacity="0.95"/>
  <!-- Middle tier -->
  <path d="M 282,192 C 290,180 310,180 318,192 C 310,200 290,200 282,192 Z" fill="#ffffff"/>
  <!-- Top Heart -->
  <path d="M 300,188 C 290,175 292,170 300,178 C 308,170 310,175 300,188 Z" fill="#ffffff"/>
  <line x1="300" y1="172" x2="300" y2="212" stroke="#b07a48" stroke-width="2"/>

  <!-- Gentle steam -->
  <path d="M285,160 Q275,120 290,80" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
  <path d="M315,155 Q325,115 310,75" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>

  <!-- Badge / Label -->
  <rect x="235" y="395" width="130" height="28" rx="14" fill="#a8754f" opacity="0.9"/>
  <text x="300" y="414" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle" letter-spacing="1">CAFFE LATTE</text>
</svg>
