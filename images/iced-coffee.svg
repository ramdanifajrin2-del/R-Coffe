<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#232a35"/>
      <stop offset="100%" stop-color="#0e1117"/>
    </radialGradient>
    <linearGradient id="icedCoffee" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8c582f"/>
      <stop offset="40%" stop-color="#4e2b14"/>
      <stop offset="100%" stop-color="#1d0d04"/>
    </linearGradient>
    <linearGradient id="ice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#d4ecf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a8d4ea" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bg)"/>
  <!-- Coaster -->
  <ellipse cx="300" cy="385" rx="110" ry="22" fill="#06080a" opacity="0.6"/>
  <ellipse cx="300" cy="380" rx="95" ry="16" fill="#1b242e"/>

  <!-- Coffee in Tumbler -->
  <path d="M 235,165 L 250,360 C 252,372 348,372 350,360 L 365,165 Z" fill="url(#icedCoffee)"/>

  <!-- Floating Ice Cubes -->
  <rect x="255" y="170" width="38" height="38" rx="6" fill="url(#ice)" stroke="#fff" stroke-width="1.5" transform="rotate(12, 274, 189)"/>
  <rect x="305" y="180" width="36" height="36" rx="6" fill="url(#ice)" stroke="#fff" stroke-width="1.5" transform="rotate(-15, 323, 198)"/>
  <rect x="275" y="215" width="42" height="40" rx="6" fill="url(#ice)" stroke="#fff" stroke-width="1.5" transform="rotate(5, 296, 235)"/>
  <rect x="260" y="260" width="35" height="35" rx="5" fill="url(#ice)" opacity="0.6" stroke="#fff" stroke-width="1" transform="rotate(-8, 277, 277)"/>

  <!-- Tumbler Glass Outer -->
  <path d="M 230,150 L 247,362 C 250,378 350,378 353,362 L 370,150 Z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.5"/>
  <ellipse cx="300" cy="150" rx="70" ry="20" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Glass Sheen Reflection -->
  <path d="M 242,165 L 254,345" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

  <!-- Condensation droplets -->
  <circle cx="265" cy="230" r="3" fill="#fff" opacity="0.6"/>
  <circle cx="264" cy="242" r="2" fill="#fff" opacity="0.5"/>
  <circle cx="340" cy="250" r="3" fill="#fff" opacity="0.6"/>
  <circle cx="338" cy="280" r="2.5" fill="#fff" opacity="0.5"/>
  <circle cx="280" cy="320" r="2.5" fill="#fff" opacity="0.6"/>

  <!-- Minimalist Straw -->
  <line x1="330" y1="85" x2="280" y2="355" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <line x1="330" y1="85" x2="280" y2="355" stroke="#387aa4" stroke-width="1.5" stroke-dasharray="6,6" stroke-linecap="round"/>

  <!-- Badge / Label -->
  <rect x="235" y="402" width="130" height="28" rx="14" fill="#a8754f" opacity="0.9"/>
  <text x="300" y="421" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle" letter-spacing="1">ICED COFFEE</text>
</svg>
